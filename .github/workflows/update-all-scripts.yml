# .github/workflows/update-all-scripts.yml
name: Build AllScripts + Scriptables Units

on:
  push:
    paths:
      - "Assets/Scripts/**"
      - "Assets/Scripts/Definitions/Units/**"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build AllScripts
        shell: pwsh
        run: |
          ./tools/build_all_scripts.ps1

      - name: Build AllScriptables Units
        shell: pwsh
        run: |
          ./tools/build_all_scriptables.ps1

      - name: Commit outputs
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add AllScripts.txt AllScriptables_Units.txt
          git commit -m "auto update code dumps" || echo "no changes"
          git push
